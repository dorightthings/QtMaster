[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qtmaster"
version = "0.2.0"
description = "Market-conditioned factor gating and dynamic factor-level lead-lag alignment"
readme = "README.md"
requires-python = ">=3.8,<3.12"
dependencies = [
  "torch>=2.1",
  "numpy>=1.23,<2",
  "pandas>=1.5,<2",
  "scipy>=1.10,<1.12",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
data = ["pyqlib==0.9.7", "scikit-learn==1.3.2"]

[project.scripts]
qtmaster-train = "qtmaster.train:main"

[tool.setuptools.packages.find]
where = ["src"]
